<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a14"><title>Activar conta de supervisor | MACOVI SPORT CLUB</title><style>
:root{--bg:#061a14;--green:#00a85a;--bright:#19c875;--line:rgba(220,245,230,.14);--muted:#a6b8ae;--white:#f4f7f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0,rgba(0,168,90,.14),transparent 35%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,490px)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;margin-bottom:26px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}.brand strong{font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:4px}.panel{background:linear-gradient(145deg,#102d22,#081e15);border:1px solid var(--line);border-top:3px solid var(--green);padding:28px;box-shadow:0 18px 55px #0003}.eyebrow{color:var(--bright);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.panel h1{font-size:clamp(25px,5vw,36px);letter-spacing:-.05em;text-transform:uppercase;margin:9px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;margin:17px 0 7px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:#c5d5cb}input{width:100%;padding:14px;background:#061810;border:1px solid var(--line);color:white;outline:none;border-radius:2px}input:focus{border-color:var(--green)}button,.btn{display:flex;justify-content:center;align-items:center;width:100%;padding:14px;margin-top:18px;background:var(--green);border:1px solid var(--green);color:#03140d;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer;text-decoration:none}button:hover,.btn:hover{background:var(--bright)}button:disabled{opacity:.55;cursor:wait}.message{min-height:24px;margin-top:14px;font-size:12px}.foot{color:var(--muted);font-size:10px;margin-top:18px;text-align:center}.foot a{color:var(--bright);text-decoration:none}
</style></head><body><main class="wrap">
<a class="brand" href="index.html"><img src="assets/macovi.webp" alt="Emblema Macovi"><span><strong>MACOVI SPORT CLUB</strong><small>PLATAFORMA INTERNA</small></span></a>
<section class="panel"><div class="eyebrow">Primeiro acesso · Nível 2</div><h1>Activar conta de supervisor</h1><p class="muted">Usa o Gmail indicado pelo Administrador Sénior e o código individual que recebeste. Define uma palavra-passe para os próximos acessos.</p>
<form id="activationForm"><label for="email">Gmail / endereço de e-mail</label><input id="email" type="email" autocomplete="username" required><label for="supervisorNumber">Número de supervisor</label><input id="supervisorNumber" autocomplete="off" required maxlength="16" placeholder="Ex.: SUP-XAD-001"><label for="code">Código de activação</label><input id="code" autocomplete="one-time-code" required maxlength="48" minlength="48" placeholder="Código de 48 caracteres"><label for="password">Criar palavra-passe</label><input id="password" type="password" autocomplete="new-password" required minlength="10"><label for="confirm">Confirmar palavra-passe</label><input id="confirm" type="password" autocomplete="new-password" required minlength="10"><button id="activateButton" type="submit">Activar conta ↗</button></form>
<p class="message muted" id="message" aria-live="polite"></p></section><div class="foot"><a href="supervisor.html">Já tens conta? Entrar na área do supervisor</a></div>
</main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const supabase=createClient('https://jblxmqoodtfhediqegar.supabase.co','sb_publishable_e9ohuqNh7BBIpTitCU0QmQ_6Lh7pHMY');
document.getElementById('activationForm').addEventListener('submit',async e=>{
 e.preventDefault();const msg=document.getElementById('message'),btn=document.getElementById('activateButton');
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){msg.textContent='As palavras-passe não coincidem.';return;}
 btn.disabled=true;btn.textContent='A activar...';msg.textContent='';
 const {data,error}=await supabase.functions.invoke('supervisor-activate',{body:{supervisor_number:document.getElementById('supervisorNumber').value.trim().toUpperCase(),email:document.getElementById('email').value.trim(),code:document.getElementById('code').value.trim(),password}});
 if(error||!data?.ok){msg.textContent=data?.error||'Não foi possível activar a conta. Confirma os dados ou contacta a administração.';}
 else{msg.textContent=data.message+' Acede agora à página de entrada.';document.getElementById('activationForm').reset();const link=document.createElement('a');link.href='supervisor.html';link.className='btn';link.textContent='Ir para o login do supervisor';msg.appendChild(document.createElement('br'));msg.appendChild(link);}
 btn.disabled=false;btn.textContent='Activar conta ↗';
});
</script></body></html>

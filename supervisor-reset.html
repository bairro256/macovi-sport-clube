<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a14"><title>Recuperar acesso | MACOVI SPORT CLUB</title><style>
:root{--bg:#061a14;--green:#00a85a;--bright:#19c875;--line:rgba(220,245,230,.14);--muted:#a6b8ae;--white:#f4f7f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 10%,rgba(0,168,90,.16),transparent 38%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,470px)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:25px;color:inherit;text-decoration:none}.brand img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}.brand strong{font-size:15px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:4px}.panel{background:linear-gradient(145deg,#102d22,#081e15);border:1px solid var(--line);border-top:3px solid var(--green);padding:30px;box-shadow:0 22px 70px #0005}.eyebrow{color:var(--bright);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.panel h1{font-size:30px;letter-spacing:-.05em;text-transform:uppercase;margin:9px 0}.panel p{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;margin:17px 0 7px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:#c5d5cb}input{width:100%;padding:14px;background:#061810;border:1px solid var(--line);color:white;outline:none;border-radius:2px}input:focus{border-color:var(--green)}button,.back{width:100%;display:flex;justify-content:center;align-items:center;padding:14px;margin-top:18px;background:var(--green);border:1px solid var(--green);color:#03140d;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;font-size:11px;cursor:pointer;text-decoration:none}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;margin-top:14px!important;font-size:12px!important}.foot{color:var(--muted);font-size:10px;text-align:center;margin-top:20px}.foot a{color:var(--bright);text-decoration:none}.hidden{display:none!important}
</style></head><body><main class="wrap"><a class="brand" href="index.html"><img src="assets/macovi.webp" alt="Emblema Macovi"><span><strong>MACOVI SPORT CLUB</strong><small>PLATAFORMA INTERNA</small></span></a>
<section class="panel"><div class="eyebrow">Segurança da conta</div><h1 id="heading">Recuperar palavra-passe</h1><p id="intro">Indica o Gmail da tua conta de supervisor. Enviaremos um link seguro para definires uma nova palavra-passe.</p>
<form id="requestForm"><label for="email">Gmail / endereço de e-mail</label><input id="email" type="email" autocomplete="username" required><button id="requestButton" type="submit">Enviar link de recuperação ↗</button></form>
<form id="updateForm" class="hidden"><label for="password">Nova palavra-passe</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">Confirmar palavra-passe</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button id="updateButton" type="submit">Guardar nova palavra-passe ↗</button></form>
<p class="message" id="message" aria-live="polite"></p></section><div class="foot"><a href="supervisor.html">← Voltar ao login do supervisor</a></div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const supabase=createClient('https://jblxmqoodtfhediqegar.supabase.co','sb_publishable_e9ohuqNh7BBIpTitCU0QmQ_6Lh7pHMY');
const requestForm=document.getElementById('requestForm'),updateForm=document.getElementById('updateForm'),message=document.getElementById('message');
function showPasswordForm(){requestForm.classList.add('hidden');updateForm.classList.remove('hidden');document.getElementById('heading').textContent='Definir nova palavra-passe';document.getElementById('intro').textContent='Escolhe uma palavra-passe nova com pelo menos 10 caracteres.';}
async function checkRecovery(){const {data:{session}}=await supabase.auth.getSession();if(session&&location.hash.includes('type=recovery'))showPasswordForm();}
requestForm.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('requestButton');button.disabled=true;button.textContent='A enviar...';message.textContent='';const email=document.getElementById('email').value.trim();const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});message.textContent=error?'Não foi possível enviar o link. Confirma o endereço ou contacta a administração.':'Se o endereço estiver associado a uma conta, receberás um link de recuperação. Verifica também o spam.';button.disabled=false;button.textContent='Enviar link de recuperação ↗';});
updateForm.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){message.textContent='As palavras-passe não coincidem.';return;}const button=document.getElementById('updateButton');button.disabled=true;button.textContent='A guardar...';const {error}=await supabase.auth.updateUser({password});if(error){message.textContent='Não foi possível actualizar a palavra-passe. Solicita um novo link.';button.disabled=false;button.textContent='Guardar nova palavra-passe ↗';return;}await supabase.auth.signOut();history.replaceState(null,'',location.pathname);message.textContent='Palavra-passe actualizada com sucesso. Já podes entrar com a nova palavra-passe.';updateForm.classList.add('hidden');});
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showPasswordForm();});checkRecovery();
</script></body></html>

<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a14"><title>Área Reservada · Administrador Sénior | MACOVI SPORT CLUB</title><style>
:root{--bg:#061a14;--green:#00a85a;--bright:#19c875;--line:rgba(220,245,230,.14);--muted:#a6b8ae;--white:#f4f7f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0,rgba(0,168,90,.14),transparent 35%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,470px)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;margin-bottom:26px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}.brand strong{font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:4px}.panel{background:linear-gradient(145deg,#102d22,#081e15);border:1px solid var(--line);border-top:3px solid var(--green);padding:28px;box-shadow:0 18px 55px #0003}.eyebrow{color:var(--bright);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.panel h1{font-size:clamp(25px,5vw,38px);letter-spacing:-.05em;text-transform:uppercase;margin:9px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;margin:17px 0 7px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:#c5d5cb}input{width:100%;padding:14px;background:#061810;border:1px solid var(--line);color:white;outline:none;border-radius:2px}input:focus{border-color:var(--green)}button{display:flex;justify-content:center;align-items:center;width:100%;padding:14px;margin-top:18px;background:var(--green);border:1px solid var(--green);color:#03140d;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer}button:hover{background:var(--bright)}button:disabled{opacity:.55;cursor:wait}.message{min-height:20px;margin-top:12px;font-size:12px}.secure,.foot{color:var(--muted);font-size:10px;margin-top:18px}.foot{text-align:center}.foot a{color:var(--bright);text-decoration:none}
</style></head><body><main class="wrap">
<a class="brand" href="index.html"><img src="assets/macovi.webp" alt="Emblema Macovi"><span><strong>MACOVI SPORT CLUB</strong><small>PLATAFORMA INTERNA</small></span></a>
<section class="panel"><div class="eyebrow">Área reservada · Nível 1</div><h1>Administrador Sénior</h1><p class="muted">Acesso reservado à administração central do Macovi Sport Club.</p>
<form id="loginForm"><label for="email">Gmail / endereço de e-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Entrar na plataforma ↗</button></form><p class="message muted" id="message" aria-live="polite"></p><div class="secure">Autenticação protegida pelo Supabase. Não existe criação pública de contas.</div></section><div class="foot"><a href="index.html">← Voltar ao site público</a></div>
</main><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const supabase=createClient('https://jblxmqoodtfhediqegar.supabase.co','sb_publishable_e9ohuqNh7BBIpTitCU0QmQ_6Lh7pHMY');
const form=document.getElementById('loginForm'),message=document.getElementById('message'),btn=document.getElementById('submit');
async function redirectIfAlreadyLoggedIn(){const {data:{session}}=await supabase.auth.getSession();if(!session)return;const {data:profile}=await supabase.from('profiles').select('role').eq('user_id',session.user.id).maybeSingle();if(profile?.role==='senior_admin')location.replace('admin-dashboard.html');}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='A validar...';message.textContent='';const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){message.textContent='Não foi possível entrar. Confirma o e-mail e a palavra-passe.';await supabase.auth.signOut();}else{const {data:profile,error:profileError}=await supabase.from('profiles').select('role').eq('user_id',data.user.id).maybeSingle();if(profileError||profile?.role!=='senior_admin'){message.textContent='Esta conta não tem permissões de Administrador Sénior.';await supabase.auth.signOut();}else{location.replace('admin-dashboard.html');return;}}btn.disabled=false;btn.textContent='Entrar na plataforma ↗';});
redirectIfAlreadyLoggedIn();
</script></body></html>
